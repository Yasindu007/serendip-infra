name: Feature request
description: Something Serendip should do that it doesn't.
title: "feat: "
type: Feature
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways around it, including an existing open-source project Serendip could adopt (docs/build-vs-adopt.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, api, agent, providers, ui, cli / mcp, bench / profiles, docs, not sure]
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: I've read docs/constitution.md, and this doesn't conflict with it (or I've said where it does).
